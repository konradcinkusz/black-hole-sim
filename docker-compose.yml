services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-blackhole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackhole}
      POSTGRES_DB:       ${POSTGRES_DB:-blackholesim}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Identity service ───────────────────────────────────────────────────────
  # Pulled, not built: this deployment runs its own independent instance of
  # konradcinkusz/authservice — its own database, its own signing key — rather than
  # depending on somebody else's running copy. There is no source-level dependency on
  # that repo anywhere in this one, only this pinned image reference.
  #
  # It shares the `db` container but not the database: its schema lives in its own
  # logical database, which it creates on first start, with no cross-grants to this
  # stack's. That is the boundary database-per-service actually asks for — a second
  # always-on Postgres purely to hold one more database is a cost decision, not an
  # architectural one.
  auth:
    image: ghcr.io/konradcinkusz/authservice:${AUTH_IMAGE_TAG:-v0.3.0}
    ports:
      # Published because the *browser* signs in against it directly, exactly like the API.
      - "${AUTH_PORT:-5083}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS:        http://+:8080
      DatabaseProvider:       PostgreSQL
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${AUTH_POSTGRES_DB:-authservice};Username=${POSTGRES_USER:-blackhole};Password=${POSTGRES_PASSWORD:-blackhole}"

      # RS256. The private key stays in this container; the API gets the public half from
      # the JWKS and can only verify. A PEM is mounted as a file rather than passed as an
      # environment variable because .env cannot carry a multi-line value.
      Jwt__PrivateKeyPath: /run/secrets/jwt-signing.pem

      # Product-specific, not the AuthService default: two deployments both on the default
      # issuer/audience would happily accept each other's tokens.
      Jwt__Issuer:   BlackHoleSim
      Jwt__Audience: BlackHoleSim

      # The frontend's origin, so the browser's sign-in calls are allowed.
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-8080}"
    volumes:
      - ./secrets/jwt-signing.pem:/run/secrets/jwt-signing.pem:ro
    depends_on:
      db:
        condition: service_healthy
    # No healthcheck: the image is built on the plain aspnet base and ships neither curl
    # nor wget, so every probe worth writing would fail as "unhealthy" for want of a
    # binary. Nothing here waits on it — the API discovers the signing keys lazily, on the
    # first request carrying a token, so a slow identity service costs a few 401s rather
    # than a failed boot.
    restart: unless-stopped

  # ── ASP.NET Core API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: BlackHoleSim.Api/Dockerfile
    ports:
      # Published because the browser calls the API directly now — the frontend no
      # longer proxies it. See the comment on `web` below.
      - "${API_PORT:-5081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT:        Production
      ASPNETCORE_URLS:               http://+:8080
      ConnectionStrings__Default:    "Host=db;Port=5432;Database=${POSTGRES_DB:-blackholesim};Username=${POSTGRES_USER:-blackhole};Password=${POSTGRES_PASSWORD:-blackhole}"
      # The frontend's origin, so the browser's cross-origin calls are allowed.
      Cors__AllowedOrigins__0:       "http://localhost:${WEB_PORT:-8080}"
      # Where to fetch the signing keys. The container-internal address, not the published
      # one: this is resolved by the API itself, not by a browser. Plain HTTP is fine on
      # compose's own network and never leaves it.
      Auth__Authority:               "http://auth:8080"
      Auth__Issuer:                  "BlackHoleSim"
      Auth__Audience:                "BlackHoleSim"
      Auth__RequireHttpsMetadata:    "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health is readiness: it stays red until migrations have been applied, which
      # is exactly what `web`'s depends_on wants to wait for.
      #
      # Both address families are tried rather than `localhost`, on purpose. Kestrel
      # logs `Now listening on: http://[::]:8080`, and whether that one socket also
      # answers on 127.0.0.1 depends on dual-stack support in the container — which
      # is not something a health probe should be quietly betting on. `localhost`
      # additionally leaves the order of the two up to the resolver.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || curl -fsS http://[::1]:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Blazor WASM frontend (nginx) ───────────────────────────────────────────
  # nginx used to reverse-proxy /api/ to the `api` service, which made the two a
  # single origin locally. That trick does not survive deployment: on a platform
  # where each service is its own app with its own hostname there is no `api` to
  # resolve. The browser now calls the API by its real address, given here at
  # container start, and the same image runs unchanged in every environment.
  web:
    build:
      context: .
      dockerfile: BlackHoleSim.Web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT:          "8080"
      # Both resolved by the *browser*, not by this container, so they are host addresses.
      API_BASE_URL:  "http://localhost:${API_PORT:-5081}"
      AUTH_BASE_URL: "http://localhost:${AUTH_PORT:-5083}"
    depends_on:
      api:
        condition: service_healthy
      auth:
        # Started, not healthy: the identity service has no probe (see above), and the
        # frontend only needs it once somebody clicks "sign in".
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || wget -qO- http://[::1]:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
