# Install once per clone:
#
#   pip install pre-commit && pre-commit install
#
# `scripts/setup.sh` does it for you. This hook is now the *only* automatic secret
# scanning in the repository — the CI job that used to cover contributors who skipped
# it is gone, so a clone without `pre-commit install` has none at all. Installing it is
# not optional politeness.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Renders belong in the database, not in git history.
        args: ["--maxkb=2048"]
      # Deliberately no mixed-line-ending hook: .gitattributes already decides line
      # endings per file type, and it disagrees with a blanket --fix=lf on .sln and
      # .ps1. Two tools normalising the same thing differently is how a repository
      # gets a permanently dirty working tree.
