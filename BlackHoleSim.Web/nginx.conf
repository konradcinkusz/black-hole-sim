server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM — all client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Reverse-proxy the API so the browser has a single origin (no CORS needed in prod)
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # allow time for long renders
    }

    # WASM MIME type
    types {
        application/wasm wasm;
    }

    # Compression
    gzip on;
    gzip_types application/wasm application/javascript text/css text/plain application/json;
    gzip_comp_level 6;
}
