# Rendered at container start by /docker-entrypoint.d/30-blackholesim-config.sh,
# which replaces __PORT__ with $PORT (default 8080). The placeholder is deliberate:
# the port a container listens on is deployment data, and a platform that asks for a
# different one should not need a rebuilt image.
server {
    listen __PORT__;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dedicated health endpoint. Deliberately NOT the index page: a broken bundle
    # still serves index.html with a 200, so a check pointed at / passes on a white
    # screen. This answers for the server only, and means what it says.
    location = /healthz {
        access_log off;
        # default_type, not add_header: `return` already emits a Content-Type from
        # default_type, so adding one sends the header twice and a client is free to
        # believe the first — application/octet-stream.
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration, written at container start. Must never be cached: a
    # promoted image would otherwise keep serving the previous environment's API
    # address from someone's browser cache.
    location = /appsettings.json {
        # `expires -1` would emit a second, weaker Cache-Control (no-cache, which
        # still permits storing), so the stricter no-store is set on its own.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Blazor WASM — all client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # WASM MIME type, scoped to a location on purpose. A `types` block replaces the
    # inherited MIME map for the whole context it sits in, rather than adding to it,
    # so the same two lines at server level drop every other mapping and leave
    # index.html and the stylesheets as the http-level default_type,
    # application/octet-stream — which a browser downloads instead of rendering.
    # Confining it here overrides the mapping only for requests that are already
    # .wasm. nginx has mapped .wasm itself since 1.21.5; this stays as the guard for
    # an older base image.
    location ~ \.wasm$ {
        types {
            application/wasm wasm;
        }
    }

    # Compression
    gzip on;
    gzip_types application/wasm application/javascript text/css text/plain application/json;
    gzip_comp_level 6;
}
