name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore BlackHoleSim.sln

      - name: Build
        run: dotnet build BlackHoleSim.sln -c Release --no-restore

      - name: Test
        run: dotnet test BlackHoleSim.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/*.trx"

  docker-build-api:
    name: Docker build (API)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f BlackHoleSim.Api/Dockerfile -t blackholesim-api:ci .

  docker-build-web:
    name: Docker build (Web)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Web image
        run: docker build -f BlackHoleSim.Web/Dockerfile -t blackholesim-web:ci .
