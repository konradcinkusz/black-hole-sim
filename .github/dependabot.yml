version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aspire:
        patterns:
          - "Aspire.*"
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/BlackHoleSim.Api"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/BlackHoleSim.Web"
    schedule:
      interval: weekly
